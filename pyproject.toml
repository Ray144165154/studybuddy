[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studybuddy"
version = "0.9.0"
description = "A textbook-grounded study assistant with citations and long-term memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ray144165154" }]
keywords = ["study", "education", "rag", "pdf", "llm", "agent", "spaced-repetition"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Typing :: Typed",
]
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
local-embed = ["fastembed>=0.3.0"]
desktop = ["pywebview>=4.4"]
build = ["pyinstaller>=6.0"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/Ray144165154/studybuddy"
Repository = "https://github.com/Ray144165154/studybuddy"
Issues = "https://github.com/Ray144165154/studybuddy/issues"
Changelog = "https://github.com/Ray144165154/studybuddy/blob/main/CHANGELOG.md"

[project.scripts]
studybuddy = "studybuddy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studybuddy"]

[tool.hatch.build.targets.sdist]
include = ["src/studybuddy", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["RET504", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "PTH"]
"examples/*" = ["T201"]
# Build glue: PyInstaller specs are executed with injected globals, and the frozen
# entry must use plain open() on devnull before anything else is imported.
"packaging/*" = ["PTH", "F821"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/studybuddy"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true
