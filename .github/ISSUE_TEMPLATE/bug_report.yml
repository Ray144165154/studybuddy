name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behaviour, including the full traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: plainagent version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model / provider
      placeholder: "deepseek-chat via https://api.deepseek.com/v1"
