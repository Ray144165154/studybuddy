name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/studybuddy

      - name: Frontend syntax check
        run: node --check src/studybuddy/webui/app.js

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Offline demo (no API key, no network)
        run: python examples/offline_demo.py

  cross-platform:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-latest"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/studybuddy

      - name: Frontend syntax check
        run: node --check src/studybuddy/webui/app.js

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Offline demo
        run: python examples/offline_demo.py

      - name: Web UI smoke (import + route table)
        run: python -c "from studybuddy.web import WebApp, serve, _Handler; print('web ui importable')"

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/studybuddy --version
          /tmp/venv/bin/python -c "from studybuddy import StudyBuddy, Library, Memory; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
