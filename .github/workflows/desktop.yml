name: Desktop build

# Builds the double-clickable app. Runs on demand and on version tags; a tag also
# attaches the artifact to the GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Self-check from source
        run: python -m studybuddy desktop --check

      - name: Build
        run: pyinstaller packaging/studybuddy-desktop.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the Windows binary
        if: runner.os == 'Windows'
        # A windowed exe does not block the shell, so Start-Process -Wait is required.
        run: |
          $exe = (Resolve-Path "dist\StudyBuddy\StudyBuddy.exe").Path
          $p = Start-Process -FilePath $exe -WorkingDirectory $env:TEMP -ArgumentList "--check" -Wait -PassThru `
               -RedirectStandardOutput check.log -RedirectStandardError check.err
          Get-Content check.log, check.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "自检失败，退出码 $($p.ExitCode)"; exit 1 }

      - name: Smoke test the macOS app outside the checkout
        if: runner.os == 'macOS'
        run: |
          executable="$PWD/dist/StudyBuddy.app/Contents/MacOS/StudyBuddy"
          cd "$RUNNER_TEMP"
          "$executable" --check

      - name: Package Windows
        if: runner.os == 'Windows'
        # Onedir distribution: ship the whole folder, not a single file.
        run: Compress-Archive -Path dist\StudyBuddy\* -DestinationPath dist\StudyBuddy-${{ matrix.platform }}.zip -Force

      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/StudyBuddy.app dist/StudyBuddy-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-${{ matrix.platform }}
          path: dist/StudyBuddy-${{ matrix.platform }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StudyBuddy-${{ matrix.platform }}.zip
